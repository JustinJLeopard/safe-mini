[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-mini"
version = "0.1.0"
description = "A bounded local-execution substrate with policy guards for mini-swe-agent-style coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Justin Leopard", email = "justinleopard@users.noreply.github.com"},
]
keywords = ["agent", "mini-swe-agent", "executor", "policy-guard", "substrate", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/JustinJLeopard/safe-mini"
Repository = "https://github.com/JustinJLeopard/safe-mini"
Issues = "https://github.com/JustinJLeopard/safe-mini/issues"

[tool.hatch.build.targets.wheel]
packages = ["safe_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["tests/fixtures", "reference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"reference/*" = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]   # untouched lab code

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
